<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>けいか堂 サイト案 見比べ</title>
<meta name="description" content="本命1案と別案7案を、このページ上で切り替えて見比べられます。">
<link rel="icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #16161a; --bar: #1f1f24; --fg: #ece8df; --muted: #a39d92; --line: #34343b; --amber: #d1842b;
    --sans: "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; --serif: "Noto Serif JP", serif; color-scheme: dark; }
  * { box-sizing: border-box; border-radius: 0 !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.6; display: flex; flex-direction: column; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  /* 上部バー */
  .top { background: var(--bar); border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  .row1 { display: flex; align-items: center; gap: 12px; padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); }
  .row1 img { width: 30px; height: 30px; }
  .row1 h1 { margin: 0; font-family: var(--serif); font-size: 15px; font-weight: 500; letter-spacing: .08em; white-space: nowrap; }
  .row1 .sp { flex: 1; }
  .row1 .lnk { font-size: 12px; color: var(--muted); border: 1px solid var(--line); padding: 4px 10px; white-space: nowrap; }
  .row1 .lnk:hover { color: var(--amber); border-color: var(--amber); }
  .tabs { display: flex; overflow-x: auto; scrollbar-width: none; border-top: 1px solid var(--line); }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: 0 0 auto; padding: 10px 16px; border-right: 1px solid var(--line); font-size: 13px; letter-spacing: .04em; color: var(--muted); border-bottom: 3px solid transparent; }
  .tabs button b { display: block; font-size: 11px; color: var(--amber); letter-spacing: .15em; font-weight: 700; }
  .tabs button.on { color: #fff; background: var(--bg); border-bottom-color: var(--amber); }
  .tabs button:hover { color: #fff; }
  .row3 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .row3 .desc { flex: 1 1 320px; min-width: 0; }
  .row3 .desc strong { color: #fff; font-weight: 500; margin-right: 8px; }
  .row3 .ctl { display: flex; gap: 6px; flex-wrap: wrap; }
  .row3 .ctl button, .row3 .ctl a { border: 1px solid var(--line); padding: 4px 10px; font-size: 12px; color: var(--fg); white-space: nowrap; }
  .row3 .ctl button.on { border-color: var(--amber); color: var(--amber); }
  .row3 .ctl button:hover, .row3 .ctl a:hover { border-color: var(--amber); }
  .row3 .ctl button.done { background: var(--amber); color: #111; border-color: var(--amber); }
  /* 表示枠 */
  .stage { flex: 1 1 auto; min-height: 0; display: flex; justify-content: center; background: #0d0d0f; position: relative; }
  .stage iframe { width: 100%; height: 100%; border: 0; background: #000; display: block; }
  .stage.phone { padding: 14px 0; }
  .stage.phone iframe { width: 390px; max-width: 100%; border: 1px solid var(--line); box-shadow: 0 0 0 6px #1b1b1f; }
  .stage .loading { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); color: var(--muted); font-size: 13px; letter-spacing: .2em; pointer-events: none; opacity: 0; transition: opacity .2s; }
  .stage.busy .loading { opacity: 1; }
  @media (max-width: 640px) {
    .row1 h1 { font-size: 13px; }
    .row1 .lnk.hideSp { display: none; }
    .tabs button { padding: 8px 12px; font-size: 12px; }
    .row3 .desc { display: none; }
    .stage.phone { padding: 0; } .stage.phone iframe { width: 100%; border: 0; box-shadow: none; }
  }
</style>
</head>
<body>
<div class="top">
  <div class="row1">
    <img src="images/logo.jpg" alt="">
    <h1>けいか堂飲料店 新ホームページ 案の見比べ</h1>
    <span class="sp"></span>
    <a class="lnk hideSp" href="list.html">案の説明一覧</a>
    <a class="lnk" id="openNew" href="../" target="_blank" rel="noopener">この案を別タブで開く</a>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="row3">
    <div class="desc" id="desc"></div>
    <div class="ctl">
      <button type="button" id="pc" class="on">パソコン表示</button>
      <button type="button" id="sp">スマホ表示</button>
      <button type="button" id="copy">この案のURLをコピー</button>
    </div>
  </div>
</div>
<div class="stage" id="stage">
  <div class="loading">LOADING</div>
  <iframe id="frame" title="サイト案のプレビュー" src="about:blank"></iframe>
</div>

<script>
  var CASES = [
    { key: 'main', tag: '本命', name: '黒 × 琥珀の酒場サイト', url: '../', desc: '旧サイトの雰囲気とロゴを引き継ぎ、情報量を最大化。全12ページ（店舗4・こだわり3・アクセス・会社・英語ほか）。' },
    { key: 'A', tag: '案A', name: '白基調の企業サイト型', url: '../variants/A-corporate/', desc: 'ブランド一覧・ニュース・理念・採用・会社情報。飲食店運営会社に最も多い王道構成。' },
    { key: 'B', tag: '案B', name: '雑誌風エディトリアル型', url: '../variants/B-editorial/', desc: '「湯島夜話」という誌面に見立て、章立てとインタビューで物語を読ませる。' },
    { key: 'C', tag: '案C', name: '和・縦書きの老舗型', url: '../variants/C-wa/', desc: '和紙の地に墨と朱、縦書きの見出しと朱印。品書きも漢数字の縦長。' },
    { key: 'D', tag: '案D', name: '没入型ワンページ', url: '../variants/D-immersive/', desc: '黒地に金、全画面写真で四つの店を縦に読ませる。右端のドット目次、横にめくる写真帯。' },
    { key: 'E', tag: '案E', name: 'ブランドポータル・タイル型', url: '../variants/E-portal/', desc: '業態ボタンで絞り込めるタイル一覧と、数字・ニュース・採用。店が増えても崩れない。' },
    { key: 'F', tag: '案F', name: '昭和レトロ・ポップ型', url: '../variants/F-retro/', desc: '赤と黄色、チラシのように名物と値段を大きく。大衆酒場チェーン風の賑やかさ。' },
    { key: 'G', tag: '案G', name: '4分割スプリット型', url: '../variants/G-split/', desc: '最初の画面で四つの店を縦パネルに。触れると色づいて広がる、モノクロのモダンな構成。' }
  ];
  var tabs = document.getElementById('tabs'), frame = document.getElementById('frame'), desc = document.getElementById('desc');
  var stage = document.getElementById('stage'), openNew = document.getElementById('openNew'), cur = null;
  CASES.forEach(function (c) {
    var b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'tab');
    b.innerHTML = '<b>' + c.tag + '</b>' + c.name; b.dataset.key = c.key;
    b.addEventListener('click', function () { show(c.key, true); });
    tabs.appendChild(b);
  });
  function show(key, push) {
    var c = CASES.filter(function (x) { return x.key === key; })[0] || CASES[0];
    if (cur === c.key) return;
    cur = c.key;
    tabs.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.dataset.key === c.key); });
    desc.innerHTML = '<strong>' + c.tag + '　' + c.name + '</strong>' + c.desc;
    openNew.href = c.url;
    stage.classList.add('busy');
    frame.src = c.url;
    if (push) { try { history.replaceState(null, '', '#' + c.key); } catch (e) {} }
    var on = tabs.querySelector('button.on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'center' });
  }
  frame.addEventListener('load', function () { stage.classList.remove('busy'); });
  document.getElementById('pc').addEventListener('click', function () { stage.classList.remove('phone'); this.classList.add('on'); document.getElementById('sp').classList.remove('on'); });
  document.getElementById('sp').addEventListener('click', function () { stage.classList.add('phone'); this.classList.add('on'); document.getElementById('pc').classList.remove('on'); });
  document.getElementById('copy').addEventListener('click', function () {
    var b = this, u = location.href.split('#')[0] + '#' + cur;
    var done = function () { var t = b.textContent; b.textContent = 'コピーしました'; b.classList.add('done'); setTimeout(function () { b.textContent = t; b.classList.remove('done'); }, 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(u).then(done, function () { window.prompt('URLをコピーしてください', u); });
    else window.prompt('URLをコピーしてください', u);
  });
  show((location.hash || '#main').slice(1), false);
  window.addEventListener('hashchange', function () { show((location.hash || '#main').slice(1), false); });
</script>
</body>
</html>
